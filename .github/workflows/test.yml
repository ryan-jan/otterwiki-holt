name: Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      otterwiki-version:
        description: Otter Wiki image tag to test against
        default: 2.27.0
  # The release and daily workflows run the tests through this.
  workflow_call:
    inputs:
      otterwiki-version:
        type: string
        default: 2.27.0

permissions:
  contents: read

jobs:
  integration:
    name: Integration tests (Otter Wiki ${{ inputs.otterwiki-version || '2.27.0' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker pull -q redimp/otterwiki:${{ inputs.otterwiki-version || '2.27.0' }}
      - run: npm run test:integration
        env:
          OTTERWIKI_VERSION: ${{ inputs.otterwiki-version || '2.27.0' }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
